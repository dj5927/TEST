plugins {
    id 'com.android.application'
}

def releaseSigningProperties = new Properties()
def releaseSigningPropertiesFile = rootProject.file('release-signing.properties')
def hasReleaseSigning = releaseSigningPropertiesFile.exists()
if (hasReleaseSigning) {
    releaseSigningPropertiesFile.withInputStream { releaseSigningProperties.load(it) }
}

android {
    namespace 'com.reblue.android'
    compileSdkVersion 35
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'com.reblue.android'
        minSdkVersion 28
        targetSdkVersion 35
        versionCode 1
        versionName '0.1.0-preview'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile rootProject.file(releaseSigningProperties.getProperty('storeFile'))
                storePassword releaseSigningProperties.getProperty('storePassword')
                keyAlias releaseSigningProperties.getProperty('keyAlias')
                keyPassword releaseSigningProperties.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    lint {
        abortOnError = false
    }
}

dependencies {
}
